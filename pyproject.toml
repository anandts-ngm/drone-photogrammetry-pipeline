[project]
name = "drone-photogrammetry-pipeline"
version = "0.1.0"
description = "Reproducible drone RGB photogrammetry and master orthophoto production for DJI P1 and L2/L3 RGB cameras."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

# Production dependencies are bounded on both sides. Nothing floats, and uv.lock pins the
# exact resolution. Dependencies named in the technology stack but not yet used by any
# module (pyproj, Shapely, GeoPandas, Pandas, SciPy) are deliberately absent until a
# module needs them.
dependencies = [
    "typer>=0.15,<0.17",
    "rich>=13.9,<15",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<0.29",
    "rasterio>=1.4,<2",
    "numpy>=2.1,<3",
    "pyproj>=3.7,<4",
    # Only for derived previews. Encoding a JPEG is not something to hand-roll, and Rasterio's
    # GDAL cannot write one without also writing a georeferenced sidecar into the tree.
    "pillow>=11.0,<12",
]

[project.scripts]
drone-photo = "drone_photogrammetry_pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<0.13",
    "mypy>=1.13,<2",
    "types-PyYAML>=6.0,<7",
    "pre-commit>=4.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_photogrammetry_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "PTH",      # use pathlib
    "RET",      # return simplification
    "SIM",      # simplify
    "ARG",      # unused arguments
    "TRY",      # exception antipatterns
    "RUF",
]
ignore = [
    "TRY003",   # long messages in raise: QA failures must say exactly what was violated
    # A configuration file that is not a YAML mapping is a malformed document, which is a
    # value problem for the operator to fix, not a type error made by a caller.
    "TRY004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]
# NodeODM's API uses camelCase field names. The schema mirrors them exactly so it can be
# compared against the upstream documentation without translating, and so a rename upstream
# shows up as a mismatch rather than being silently absorbed.
"src/drone_photogrammetry_pipeline/nodeodm/schemas.py" = ["N815"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "affine.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running NodeODM or other external service; excluded from ordinary CI",
]
addopts = "-m 'not integration'"
