# Sant: 9 zones (N1-N9) of DJI Terra orthophotos, Nergui Undur licence area.
#
# Run it with:
#   drone-photo process-project projects/sant.yaml
#
# The zones are looked for in <DPP_INPUTS_ROOT>/sant, which you set once in .env; pass
# --source-root <dir> to read them from somewhere else instead.

project_id: Sant
source_type: DJI_TERRA
asset: dom.tif
profile_id: external_terra

# No declaration, deliberately. The files declare EPSG:32649 and no vertical CRS, and unlike
# Buduunkhad this delivery came with no document stating a vertical datum. Declaring a guessed
# one would turn "unknown" into a wrong answer that nothing downstream could question. The
# masters are therefore not suitable for absolute-Z work until the drone team supplies it.
declare_crs: null
height_type: UNKNOWN
sensor: null

# Unset: chosen from the survey's extent. Sant is 2,667 m across, so this comes out at 0.5 m
# rather than the 1 m the larger survey gets.
overview_gsd: null
preview_longest_side: 2048
destripe_previews: true

notes: >
  22 further zones (N10-N31) exist on the delivery drive but not locally. Adding them is a
  matter of copying them under source_root and rerunning: blocks that already have a master
  are skipped unless --force is given.
