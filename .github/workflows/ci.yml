name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI runs lint, format verification, type checks and unit tests including the synthetic
# raster QA suite. It deliberately does not run photogrammetry: integration tests that
# need a real NodeODM are excluded by the default pytest marker expression.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format verification
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -v
