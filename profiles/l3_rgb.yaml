# L3 RGB mapping camera — PLACEHOLDER.
#
# The L3 sensor specifications have not been supplied and are not publicly established
# (docs/decisions-and-verification.md, V10). Everything below is inherited from the L2
# profile purely so that the identifier resolves; nothing here has been validated against
# an actual L3 acquisition.
#
# Do not use this profile for a delivered product until the sensor characteristics are
# confirmed and this comment is removed.

profile_id: l3_rgb_master
profile_version: 2

sensor: L3_RGB
lens: null

processing:
  engine: ODM
  odm:
    dsm: false
    dtm: false
    # Ask for finer than any of these flights can deliver, and let the engine clamp.
    #
    # ODM's default is 5 cm/px, which on a real P1 block measured here produced a 5.0 cm master
    # from imagery whose native ground sample distance is 1.50 cm -- three times coarser
    # linearly, eleven times in area, and silently. `ignore-gsd: false` keeps ODM from going
    # finer than the imagery supports, so asking for 1 cm yields the native resolution rather
    # than an interpolated one. The master contract requires native; this is what enforces it
    # on the ODM route.
    orthophoto-resolution: 1.0
    ignore-gsd: false

radiometry:
  policy: analytical_master
  provisional: true
  odm:
    texturing-skip-global-seam-leveling: true
    orthophoto-cutline: false
    build-overviews: false
    orthophoto-compression: DEFLATE
    radiometric-calibration: none

outputs:
  orthophoto: true
  dsm: false
  point_cloud: false

qa:
  raster_contract: true

packaging:
  source_asset: odm_orthophoto/odm_orthophoto.tif
  allow_alpha_from_nodata: false
